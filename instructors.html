<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instructor Profile</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background:#0f0f10; color:#e9eef2; font:16px/1.45 system-ui, Arial, sans-serif; }
    .wrap { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    .card { background:#18191c; border:1px solid #2a2f33; border-radius:12px; padding:20px; }
    .meta { color:#9aa7b2; font-size:14px; margin-top:6px; }
    .btn { background:#081018; color:#cde7ee; padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:600; display:inline-block; }
    .btn.primary { background:#ffa130; color:#0b0e12; }
    .note { color:#9aa7b2; margin-top:16px; }
    .hidden { display:none; }
  </style>
</head>
<body>

  <!-- Header (same pattern as the rest of the site) -->
  <header class="site-header" data-header>
    <div class="container nav">
      <a class="brand" href="/">WOODSHED&nbsp;LAB</a>
      <nav class="links">
        <a href="/#how">How It Works</a>
        <a href="/instructors.html">Instructors</a>
        <a href="/#pricing">Pricing</a>
        <a href="/#faq">FAQ</a>
        <a class="btn" href="/apply.html">Apply</a>
        <a href="/me.html" id="profile-link" class="btn small hidden">My Profile</a>
        <button id="auth-btn-mobile" class="btn small hide-desktop">Sign in</button>
        <a href="#" id="auth-btn" class="btn small">Sign in</a>
        <span id="user-chip" class="hidden" style="margin-left:.5rem;opacity:.8;"></span>
      </nav>
      <button class="hamburger" aria-label="Open Menu" data-menu-btn>
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-drawer" data-drawer>
      <a href="/">Home</a>
      <a href="/#how">How It Works</a>
      <a href="/instructors.html">Instructors</a>
      <a href="/#pricing">Pricing</a>
      <a href="/#faq">FAQ</a>
      <a class="btn" href="/apply.html">Apply</a>
      <a id="drawer-sign" href="/signin.html" class="btn small">Sign in</a>
      <a id="drawer-profile" href="/me.html" class="btn small hidden">My Profile</a>
    </div>
  </header>

  <div class="wrap">
    <h1 style="margin:0 0 8px;">Instructors</h1>
    <div id="roleLine" class="meta"></div>

    <div class="card" style="margin-top:16px;">
  <div id="instructor-list" class="meta">Loading instructors…</div>
</div>

  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    // --- Read ?id=<INSTRUCTOR_UUID> from URL ---
    const params = new URLSearchParams(location.search);
    const instructorId = params.get('id');

    const nameEl   = document.getElementById('name');
    const roleEl   = document.getElementById('roleLine');
    const bioEl    = document.getElementById('bio');
    const startBtn = document.getElementById('start');

    // Auth (who am I?)
    const { data: { session } } = await supabase.auth.getSession();
    const myId = session?.user?.id || null;

    // --- Load instructor profile (from public.profiles: id, full_name, role) ---
    async function loadProfile() {
      if (!instructorId) {
        nameEl.textContent = 'Missing instructor id';
        bioEl.textContent  = 'Open this page as /instructor.html?id=INSTRUCTOR_UUID';
        startBtn.style.display = 'none';
        return;
      }

      const { data, error } = await supabase
        .from('profiles')              // table is lowercase 'profiles'
        .select('id, full_name, role') // no 'email' here; that lives in auth.users
        .eq('id', instructorId)
        .single();

      if (error || !data) {
        console.error(error);
        nameEl.textContent = 'Instructor not found';
        bioEl.textContent  = 'Check the link or id.';
        startBtn.style.display = 'none';
        return;
      }

      nameEl.textContent = data.full_name || 'Instructor';
      roleEl.textContent = data.role ? `Role: ${data.role}` : '';
      bioEl.textContent  = (data.role === 'instructor')
        ? 'Verified instructor profile.'
        : 'Note: this profile is not marked as instructor (role != instructor).';
    }

    await loadProfile();

    // --- Start or find an existing thread, then redirect ---
    startBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!instructorId) return;

      // Require login
      if (!myId) {
        alert('Please sign in first.');
        location.href = '/';
        return;
      }

      // 1) Try to find existing thread for this student + instructor
      const { data: existing, error: findErr } = await supabase
        .from('lesson_threads')
        .select('id')
        .eq('student_id', myId)
        .eq('instructor_id', instructorId)
        .maybeSingle();

      if (!findErr && existing?.id) {
        location.href = `/thread.html?thread=${encodeURIComponent(existing.id)}`;
        return;
      }

      // 2) Create a new thread
      const { data: created, error: createErr } = await supabase
        .from('lesson_threads')
        .insert([{ student_id: myId, instructor_id: instructorId }])
        .select('id')
        .single();

      if (createErr) {
        console.error(createErr);
        alert('Could not start lesson.');
        return;
      }

      location.href = `/thread.html?thread=${encodeURIComponent(created.id)}`;
    });

    // --- Header auth UI (Sign in/out + My Profile toggle) ---
    const authBtn        = document.querySelector('#auth-btn');
    const drawerSign     = document.querySelector('#drawer-sign');
    const profileLink    = document.querySelector('#profile-link');
    const drawerProfile  = document.querySelector('#drawer-profile');

    function setHeaderAuth(isLoggedIn) {
      const buttons = [authBtn, drawerSign].filter(Boolean);

      // Toggle My Profile visibility
      if (profileLink)   profileLink.classList.toggle('hidden', !isLoggedIn);
      if (drawerProfile) drawerProfile.classList.toggle('hidden', !isLoggedIn);

      if (buttons.length) {
        if (isLoggedIn) {
          buttons.forEach((btn) => {
            btn.textContent = 'Sign out';
            btn.classList.add('danger');
            btn.onclick = async (e) => {
              e.preventDefault();
              await supabase.auth.signOut();
              window.location.href = '/';
            };
          });
        } else {
          buttons.forEach((btn) => {
            btn.textContent = 'Sign in';
            btn.classList.remove('danger');
            btn.onclick = (e) => {
              e.preventDefault();
              window.location.href = '/signin.html';
            };
          });
        }
      }
    }

    setHeaderAuth(!!myId);
    supabase.auth.onAuthStateChange((_evt, sess) => setHeaderAuth(!!sess));

    // --- Mobile drawer open/close (if your styles.css expects this) ---
    const burger = document.querySelector('.hamburger');
    const header = document.querySelector('.site-header');
    burger?.addEventListener('click', () => header.classList.toggle('open'));

    const drawer = document.querySelector('.mobile-drawer');
    drawer?.addEventListener('click', (e) => {
      if (e.target.closest('a')) header.classList.remove('open');
    });
  </script>
</body>
</html>
