<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instructors — Woodshed Lab</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      background: #0f0f10;
      color: #e9eef2;
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .wrap {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px 48px;
    }
    .page-title {
      margin: 0 0 4px;
      font-size: 28px;
      font-weight: 700;
    }
    .page-sub {
      margin: 0 0 20px;
      color: #9aa7b2;
      font-size: 14px;
    }
    .card {
      background: #18191c;
      border-radius: 12px;
      border: 1px solid #2a2f33;
      padding: 18px 18px 10px;
    }
    .inst-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .inst-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: #101216;
      border: 1px solid #262a2f;
      cursor: default;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
    }
    .inst-row:hover {
      background: #1b1d22;
      border-color: #ffa130;
      transform: translateY(-1px);
    }
    .inst-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .inst-name {
      font-size: 15px;
      font-weight: 600;
    }
    .inst-meta {
      font-size: 13px;
      color: #9aa7b2;
    }
    .inst-tag {
      font-size: 12px;
      color: #ffa130;
      font-weight: 600;
      white-space: nowrap;
    }
    .empty,
    .error-text {
      font-size: 14px;
      color: #9aa7b2;
    }
    .error-text {
      color: #ffb0b0;
    }
  </style>
</head>
<body>
  <!-- Header (same pattern as the rest of the site) -->
  <header class="site-header" data-header>
    <div class="container nav">
      <a class="brand" href="/">WOODSHED&nbsp;LAB</a>
      <nav class="links">
        <a href="/#how">How It Works</a>
        <a href="/instructors.html" class="active">Instructors</a>
        <a href="/#pricing">Pricing</a>
        <a href="/#faq">FAQ</a>
        <a class="btn" href="/apply.html">Apply</a>
        <a href="/me.html" id="profile-link" class="btn small hidden">My Profile</a>
        <button id="auth-btn-mobile" class="btn small hide-desktop">Sign in</button>
        <a href="#" id="auth-btn" class="btn small">Sign in</a>
        <span id="user-chip" class="hidden" style="margin-left:.5rem;opacity:.8;"></span>
      </nav>
      <button class="hamburger" aria-label="Open Menu" data-menu-btn>
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-drawer" data-drawer>
      <a href="/">Home</a>
      <a href="/#how">How It Works</a>
      <a href="/instructors.html">Instructors</a>
      <a href="/#pricing">Pricing</a>
      <a href="/#faq">FAQ</a>
      <a class="btn" href="/apply.html">Apply</a>
      <a id="drawer-sign" href="/signin.html" class="btn small">Sign in</a>
      <a id="drawer-profile" href="/me.html" class="btn small hidden">My Profile</a>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Instructors</h1>
    <p class="page-sub">Browse available coaches. Anyone with role = “instructor” in Supabase will appear here.</p>

    <div class="card">
      <div id="instructor-list" class="inst-list">
        <p class="empty">Loading instructors…</p>
      </div>
      <p id="inst-error" class="error-text" style="display:none;margin-top:10px;"></p>
    </div>
  </main>

  <script type="module">
    import { supabase } from './supabase.js';
    console.log('INSTRUCTORS MODULE LOADED');
    
    const listEl       = document.getElementById('instructor-list');
    const errorEl      = document.getElementById('inst-error');
    const authBtn      = document.querySelector('#auth-btn');
    const drawerSign   = document.querySelector('#drawer-sign');
    const profileLink  = document.querySelector('#profile-link');
    const drawerProfile = document.querySelector('#drawer-profile');
    const burger       = document.querySelector('.hamburger');
    const header       = document.querySelector('.site-header');
    const drawer       = document.querySelector('.mobile-drawer');

    function setHeaderAuth(isLoggedIn) {
      const buttons = [authBtn, drawerSign].filter(Boolean);

      if (profileLink)   profileLink.classList.toggle('hidden', !isLoggedIn);
      if (drawerProfile) drawerProfile.classList.toggle('hidden', !isLoggedIn);

      if (buttons.length) {
        if (isLoggedIn) {
          buttons.forEach((btn) => {
            btn.textContent = 'Sign out';
            btn.classList.add('danger');
            btn.onclick = async (e) => {
              e.preventDefault();
              await supabase.auth.signOut();
              window.location.href = '/';
            };
          });
        } else {
          buttons.forEach((btn) => {
            btn.textContent = 'Sign in';
            btn.classList.remove('danger');
            btn.onclick = (e) => {
              e.preventDefault();
              window.location.href = '/signin.html';
            };
          });
        }
      }
    }

    async function loadInstructors() {
      console.log('loadInstructors START');
      if (!listEl) return;
      listEl.innerHTML = '<p class="empty">Loading instructors…</p>';
      errorEl.style.display = 'none';

      const { data, error } = await supabase
        .from('profiles')
        .select('id, full_name, role')
        .order('full_name', { ascending: true });

      if (error) {
        console.error(error);
        listEl.innerHTML = '';
        errorEl.textContent = 'Error loading instructors.';
        errorEl.style.display = 'block';
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = '<p class="empty">No instructors available yet.</p>';
        return;
      }

      listEl.innerHTML = '';
      data.forEach((inst) => {
        const row = document.createElement('div');
        row.className = 'inst-row';

        row.innerHTML = `
          <div class="inst-main">
            <div class="inst-name">${inst.full_name || 'Instructor'}</div>
            <div class="inst-meta">Role: ${inst.role || 'instructor'}</div>
          </div>
          <div class="inst-tag">Available</div>
        `;

        // In the future we can add: click to open profile/thread
        // row.addEventListener('click', () => {
        //   window.location.href = '/instructor.html?id=' + encodeURIComponent(inst.id);
        // });

        listEl.appendChild(row);
      });
    }

        async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      setHeaderAuth(!!session?.user);

      await loadInstructors();

      supabase.auth.onAuthStateChange((_event, sess) => {
        setHeaderAuth(!!sess?.user);
      });
    }

    // mobile drawer
    burger?.addEventListener('click', () => {
      header.classList.toggle('open');
    });

    drawer?.addEventListener('click', (e) => {
      if (e.target === drawer) {
        header.classList.remove('open');
      }
    });

        // Start the app
    init().catch((err) => {
      console.error('init error', err);
      errorEl.textContent = 'Error loading instructors.';
      errorEl.style.display = 'block';
    });
</script>
</body>
</html>
