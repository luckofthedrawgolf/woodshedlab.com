<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instructor Profile</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background:#0f0f10; color:#e9eef2; font:16px/1.45 system-ui, Arial, sans-serif; }
    .wrap { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    .card { background:#18191c; border:1px solid #2a2f33; border-radius:12px; padding:20px; }
    .meta { color:#9aa7b2; font-size:14px; margin-top:6px; }
    .btn { background:#081018; color:#cde7ee; padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:600; display:inline-block; }
    .btn.primary { background:#ffa130; color:#0b0e12; }
    .note { color:#9aa7b2; margin-top:16px; }
  </style>
</head>
<body>

  <!-- Header (reuse your working header markup/behavior via styles.css/app.js pattern) -->
  <header class="site-header" data-header>
    <div class="container nav">
      <a class="brand" href="/">WOODSHED&nbsp;LAB</a>
      <nav class="links">
        <a href="/#how">How It Works</a>
        <a href="/instructors.html">Instructors</a>
        <a href="/#pricing">Pricing</a>
        <a href="/#faq">FAQ</a>
        <a class="btn" href="/apply.html">Apply</a>
        <button id="auth-btn-mobile" class="btn small hide-desktop">Sign in</button>
        <a href="#" id="auth-btn" class="btn small">Sign in</a>
        <span id="user-chip" class="hidden" style="margin-left:.5rem;opacity:.8;"></span>
      </nav>
      <button class="hamburger" aria-label="Open Menu" data-menu-btn>
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-drawer" data-drawer>
      <a href="/">Home</a>
      <a href="/#how">How It Works</a>
      <a href="/instructors.html">Instructors</a>
      <a href="/#pricing">Pricing</a>
      <a href="/#faq">FAQ</a>
      <a class="btn" href="/apply.html">Apply</a>
      <a id="drawer-sign" href="/signin.html" class="btn small">Sign in</a>
    </div>
  </header>

  <div class="wrap">
    <h1 id="name" style="margin:0 0 8px;">Instructor</h1>
    <div id="email" class="meta"></div>

    <div class="card" style="margin-top:16px;">
      <p id="bio" class="meta">Loading profile…</p>
      <div style="margin-top:16px;">
        <a id="start" href="#" class="btn primary">Start lesson (open thread)</a>
      </div>
      <div class="note">You’ll be redirected to the private thread for you and this instructor.</div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    // --- read ?id= from URL ---
    const params = new URLSearchParams(location.search);
    const instructorId = params.get('id');

    const nameEl = document.getElementById('name');
    const emailEl = document.getElementById('email');
    const bioEl = document.getElementById('bio');
    const startBtn = document.getElementById('start');

    // Require auth for starting a lesson, but allow viewing profile if logged out
    const { data: { session } } = await supabase.auth.getSession();
    const myId = session?.user?.id || null;

    // Load instructor profile
    async function loadProfile() {
      if (!instructorId) {
        nameEl.textContent = 'Missing instructor id';
        bioEl.textContent = 'Open this page as /instructor.html?id=INSTRUCTOR_UUID';
        startBtn.style.display = 'none';
        return;
      }

      const { data, error } = await supabase
        .from('profiles')
        .select('id, full_name, email, role')
        .eq('id', instructorId)
        .single();

      if (error || !data) {
        nameEl.textContent = 'Instructor not found';
        bioEl.textContent = 'Check the link or id.';
        startBtn.style.display = 'none';
        return;
      }

      nameEl.textContent = data.full_name || 'Instructor';
      emailEl.textContent = data.email || '';
      bioEl.textContent = (data.role === 'instructor')
        ? 'Verified instructor profile.'
        : 'Note: this profile is not marked as instructor (role != instructor).';
    }

    await loadProfile();

    // Start/Find a thread and redirect
    startBtn.addEventListener('click', async (e) => {
      e.preventDefault();

      // force login
      if (!myId) {
        alert('Please sign in first.');
        location.href = '/';
        return;
      }

      if (!instructorId) return;

      // 1) Try to find an existing thread
      const { data: existing, error: findErr } = await supabase
        .from('lesson_threads')
        .select('id')
        .or(`student_id.eq.${myId},instructor_id.eq.${myId}`)
        .eq('student_id', myId)
        .eq('instructor_id', instructorId)
        .limit(1)
        .maybeSingle();

      if (!findErr && existing?.id) {
        location.href = `/thread.html?thread=${encodeURIComponent(existing.id)}`;
        return;
      }

      // 2) Create a new thread
      const { data: created, error: createErr } = await supabase
        .from('lesson_threads')
        .insert([{ student_id: myId, instructor_id: instructorId }])
        .select('id')
        .single();

      if (createErr) {
        console.error(createErr);
        alert('Could not start lesson.');
        return;
      }

      location.href = `/thread.html?thread=${encodeURIComponent(created.id)}`;
    });

    // --- header auth UI like on your other pages ---
    const authBtn    = document.querySelector('#auth-btn');
    const drawerSign = document.querySelector('#drawer-sign');

    function setHeaderAuth(isLoggedIn) {
      const buttons = [authBtn, drawerSign].filter(Boolean);
      if (buttons.length === 0) return;
      if (isLoggedIn) {
        buttons.forEach((btn) => {
          btn.textContent = 'Sign out';
          btn.classList.add('danger');
          btn.onclick = async (e) => {
            e.preventDefault();
            await supabase.auth.signOut();
            window.location.href = '/';
          };
        });
      } else {
        buttons.forEach((btn) => {
          btn.textContent = 'Sign in';
          btn.classList.remove('danger');
          btn.onclick = (e) => {
            e.preventDefault();
            window.location.href = '/signin.html';
          };
        });
      }
    }

    setHeaderAuth(!!myId);
    supabase.auth.onAuthStateChange((_e, sess) => setHeaderAuth(!!sess));
  </script>
</body>
</html>
