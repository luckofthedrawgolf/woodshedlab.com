<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Upload</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
      padding: 40px;
    }
    input[type="file"] {
      margin: 20px;
    }
    video {
      margin-top: 20px;
      max-width: 90%;
      border: 2px solid #444;
    }
  </style>
</head>
<body>
  <h1>Upload Video to Cloudinary</h1>
  <input type="file" id="fileInput" accept="video/*">
  <button id="upload-btn">Upload</button>

  <div id="result"></div>

  <script type="module">
  import { supabase } from './supabase.js'; 
    const cloudName = "degawkws3"; // your Cloudinary cloud name
    const uploadPreset = "unsigned_upload"; // we’ll create this next

    document.getElementById("upload-btn").addEventListener("click", async () => {
  alert('Upload button handler is firing');
  // (leave the rest of your code as-is)
      const fileInput = document.getElementById("fileInput");
      if (!fileInput.files.length) {
        alert("Please select a video file first.");
        return;
      }

      document.getElementById("result").innerHTML = `<p>Uploading... please wait ⏳</p>`;

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", uploadPreset);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      document.getElementById("result").innerHTML = `
        <p>Upload successful!</p>
        <video controls src="${data.secure_url}"></video>
      `;
      // === Save to Supabase (videos) tied to current thread ===

// 1) Get ?thread=... from the URL
const thread_id = new URLSearchParams(location.search).get('thread');
if (!thread_id) {
  console.warn('No ?thread=... in URL, skipping Supabase save.');
  return;
}

// 2) Ensure the user is signed in (we need their id)
const { data: { user } } = await supabase.auth.getUser();
if (!user) {
  alert('Please sign in first.');
  return;
}

// 3) Insert the video row
const { error: dbError } = await supabase
  .from('videos')
  .insert({
    uploader_id: user.id,
    thread_id: thread_id,
    title: file.name,           // from above in your code
    url: data.secure_url        // Cloudinary URL
  });

if (dbError) {
  console.error('Supabase insert error:', dbError);
  alert('Video uploaded, but database save failed.');
} else {
  console.log('✅ Saved to Supabase successfully');
}

    });
  </script>
  <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
<!-- <script type="module" src="/app.js"></script> -->
</body>
</html>
